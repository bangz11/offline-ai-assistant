name: offline-ai-assistant

services:
  # 1. Ollama: runs AI models locally
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 2. Download models if they are not already installed
  model-init:
    image: ollama/ollama:latest
    container_name: model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in llama3.2:3b qwen2.5:1.5b; do
          if ollama list | grep -q "$$m"; then
            echo "$$m already present - skipping."
          else
            echo "Downloading $$m ..."
            ollama pull "$$m" || exit 1
          fi
        done
    networks:
      - ai-net
    restart: "no"

  # 3. Website: serves the frontend and proxies API requests
  web:
    image: nginx:alpine
    container_name: offline-ai-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    networks:
      - ai-net
    restart: unless-stopped

networks:
  ai-net:
    driver: bridge

volumes:
  ollama_data: