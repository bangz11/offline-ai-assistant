name: offline-ai-assistant

services:
  # 1) Ollama: runs the models locally
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 2) One-shot job: downloads both models ONLY if not already stored.
  model-init:
    image: ollama/ollama:latest
    container_name: model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in llama3.2:3b qwen2.5:1.5b; do
          if ollama list | grep -q "$$m"; then
            echo "$$m already present - skipping."
          else
            echo "Downloading $$m ..."
            ollama pull "$$m"
          fi
        done
    networks:
      - ai-net
    restart: "no"

  # 3) Website (nginx): serves HTML/CSS/JS and proxies /api/ to Ollama
  web: